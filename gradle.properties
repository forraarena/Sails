# Cefrium needs a big heap: the engine's classes.jar is ~50k classes and dexing
# it exceeds Gradle's default 512 MB. See https://cefrium.com/quickstart/
org.gradle.jvmargs=-Xmx8g
android.useAndroidX=true

# Cefrium SDK version; the com.cefrium Gradle plugin uses the same version.
cefriumVersion=0.21.0
