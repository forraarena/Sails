name: build

# Builds the debug APK and uploads it as an artifact, so the PoC can be
# installed on a device or x86_64 emulator without a local Android toolchain.
# On any failure, the step logs are pushed to the branch (.ci/) because the
# Actions log endpoints are not always reachable via the API.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 (Cefrium hard floor)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust unit tests (host)
        run: |
          # The crate declares #[link(android/log/EGL/GLESv3)] for the Android
          # build; for the host test binary, stub them out (tests never call
          # into them -- they exercise pure logic only).
          mkdir -p /tmp/android-stubs
          printf 'static int unused;\n' > /tmp/android-stubs/empty.c
          for lib in android log EGL GLESv3; do
            gcc -shared -fPIC -o "/tmp/android-stubs/lib$lib.so" /tmp/android-stubs/empty.c
          done
          LD_LIBRARY_PATH=/tmp/android-stubs RUSTFLAGS="-L /tmp/android-stubs" \
            cargo test --manifest-path rust/Cargo.toml

      - name: Android NDK (runner images no longer preinstall it)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build native compositor (libsails.so)
        run: |
          set -o pipefail
          bash -x scripts/build-rust.sh 2>&1 | tee build-rust.log || {
            sed 's/\x1b\[[0-9;]*m//g' build-rust.log | grep -aiE "error|failed|panicked|not found|missing|denied|abort" | cut -c1-500 | tail -35 | sed 's/^/::error::/'
            exit 1
          }

      - name: Upload native build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: build-rust.log
          if-no-files-found: warn

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (debug)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-debug.log || {
            sed 's/\x1b\[[0-9;]*m//g' gradle-debug.log | grep -aE "FAILURE|error:|Caused by|Exception|What went wrong" | cut -c1-500 | tail -35 | sed 's/^/::error::/'
            exit 1
          }

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sails-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build APK (release, unsigned)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee gradle-release.log || {
            tail -n 25 gradle-release.log | cut -c1-800 | sed 's/^/::error::/'
            exit 1
          }

      - name: Upload release APK artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: sails-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
