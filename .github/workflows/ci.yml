name: build

# Builds the debug APK and uploads it as an artifact, so the PoC can be
# installed on a device or x86_64 emulator without a local Android toolchain.
# On any failure, the step logs are pushed to the branch (.ci/) because the
# Actions log endpoints are not always reachable via the API.
on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 (Cefrium hard floor)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust unit tests (host)
        run: |
          # The crate declares #[link(android/log/EGL/GLESv3)] for the Android
          # build; for the host test binary, stub them out (tests never call
          # into them -- they exercise pure logic only).
          mkdir -p /tmp/android-stubs
          printf 'static int unused;\n' > /tmp/android-stubs/empty.c
          for lib in android log EGL GLESv3; do
            gcc -shared -fPIC -o "/tmp/android-stubs/lib$lib.so" /tmp/android-stubs/empty.c
          done
          LD_LIBRARY_PATH=/tmp/android-stubs RUSTFLAGS="-L /tmp/android-stubs" \
            cargo test --manifest-path rust/Cargo.toml

      - name: Android NDK (runner images no longer preinstall it)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build native compositor (libsails.so)
        run: |
          set -o pipefail
          bash -x scripts/build-rust.sh 2>&1 | tee build-rust.log || {
            sed 's/\x1b\[[0-9;]*m//g' build-rust.log | grep -aA6 -iE "^error|panicked" | cut -c1-400 | tail -60 | sed 's/^/::error::/'
            exit 1
          }

      - name: Upload native build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: build-rust.log
          if-no-files-found: warn

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (debug)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-debug.log || {
            sed 's/\x1b\[[0-9;]*m//g' gradle-debug.log | grep -aE "FAILURE|error:|Caused by|Exception|What went wrong" | cut -c1-500 | tail -35 | sed 's/^/::error::/'
            exit 1
          }

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sails-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build APK (release, unsigned)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee gradle-release.log || {
            tail -n 25 gradle-release.log | cut -c1-800 | sed 's/^/::error::/'
            exit 1
          }

      - name: Upload release APK artifact (unsigned->debug-signed)
        uses: actions/upload-artifact@v4
        with:
          name: sails-release-apk
          path: app/build/outputs/apk/release/app-release*.apk

  release:
    # Tag pushes (v*) produce a GitHub Release with both installable APKs.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: apks

      - name: Rename assets
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -f apks/app-debug.apk ]; then
            mv apks/app-debug.apk "apks/Sails-${TAG}-debug.apk"
          fi
          if [ -f apks/app-release.apk ]; then
            mv apks/app-release.apk "apks/Sails-${TAG}-release.apk"
          elif [ -f apks/app-release-unsigned.apk ]; then
            mv apks/app-release-unsigned.apk "apks/Sails-${TAG}-release.apk"
          fi
          ls -la apks/

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Sails ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
          gh release upload "$GITHUB_REF_NAME" apks/*.apk --clobber

  smoke:
    # Boots an x86_64 emulator, installs the APK, launches Sails, and
    # captures logcat + screenshots -- the crash the user sees on a device
    # becomes a reproducible artifact here.
    name: Emulator smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 (Cefrium hard floor)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build native compositor (both ABIs for emulator + device)
        run: |
          set -o pipefail
          SAILS_TARGETS="aarch64-linux-android x86_64-linux-android" \
            bash scripts/build-rust.sh 2>&1 | tee build-rust.log

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator + system image
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "system-images;android-30;google_apis;x86_64" "platform-tools" "emulator"

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -memory 3072
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk || \
              { sleep 10; adb install -r app/build/outputs/apk/debug/app-debug.apk; } || \
              echo "::error::adb install failed"
            adb logcat -c || true
            adb shell am start -W -n dev.sails/.MainActivity || echo "::error::am start failed"
            sleep 8
            adb exec-out screencap -p > shot-8s.png || true
            sleep 15
            adb exec-out screencap -p > shot-23s.png || true
            sleep 15
            adb exec-out screencap -p > shot-38s.png || true
            adb logcat -d > logcat.txt || true
            PID=$(adb shell pidof dev.sails 2>/dev/null | tr -d '\r' || true)
            if [ -n "$PID" ]; then
              echo "APP ALIVE pid=$PID"
              echo "alive" > verdict.txt
            else
              echo "APP PROCESS GONE (crashed or killed)"
              echo "crashed" > verdict.txt
            fi
            grep -aE "FATAL EXCEPTION|AndroidRuntime: |libc: |DEBUG   |SIGSEGV|Fatal signal|Cefrium|sails" logcat.txt \
              | cut -c1-400 | tail -60 > crash-digest.txt || true
            cat crash-digest.txt || true
            # Self-report via annotations (the only log channel readable here).
            if grep -q crashed verdict.txt; then
              sed 's/^/::error::/' crash-digest.txt | head -40 || true
            else
              echo "::notice::Sails survived 38s on the emulator, pid=$PID"
            fi
            true

      - name: Fail loudly if the app died
        run: |
          if grep -q crashed verdict.txt; then
            sed 's/^/::error::/' crash-digest.txt | head -40
            exit 1
          fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            logcat.txt
            crash-digest.txt
            shot-*.png
            verdict.txt
          if-no-files-found: warn
