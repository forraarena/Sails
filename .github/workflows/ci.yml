name: build

# Builds the debug APK and uploads it as an artifact, so the PoC can be
# installed on a device or x86_64 emulator without a local Android toolchain.
# The native build log is always uploaded as an artifact too (the Actions log
# viewer is sometimes unreachable via the API).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 (Cefrium hard floor)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Android NDK (runner images no longer preinstall it)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build native compositor (libsails.so)
        run: |
          set -x
          bash scripts/build-rust.sh 2>&1 | tee build-rust.log

      - name: Push native build log to branch (debug aid)
        if: failure()
        run: |
          git config user.name "sails-ci"
          git config user.email "sails-ci@users.noreply.github.com"
          mkdir -p .ci && cp build-rust.log .ci/last-build.log 2>/dev/null || echo "no log produced" > .ci/last-build.log
          git add .ci/last-build.log
          git commit -m "CI: native build log [skip ci]" || true
          git push

      - name: Upload native build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: build-rust.log
          if-no-files-found: warn

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (debug)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sails-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build APK (release, unsigned)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload release APK artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: sails-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
